<!doctype html>
<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#102C50" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/favicon.png" />

		<!-- Open Graph / Facebook / WhatsApp / LinkedIn Preview -->
		<meta property="og:site_name" content="SDJ Nusantara" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="SDJ Nusantara — Strategic Your Partner" />
		<meta property="og:description" content="SDJ Nusantara adalah konsultan pendidikan dan pengembangan talenta yang membantu individu serta institusi merencanakan pendidikan, mempersiapkan beasiswa, dan meningkatkan keterampilan." />
		<meta property="og:image" content="https://sdjnusantara.com/og-image.png" />
		<meta property="og:image:secure_url" content="https://sdjnusantara.com/og-image.png" />
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="SDJ Nusantara — Strategic Your Partner" />
		<meta property="og:locale" content="id_ID" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="SDJ Nusantara — Strategic Your Partner" />
		<meta name="twitter:description" content="SDJ Nusantara adalah konsultan pendidikan dan pengembangan talenta yang membantu individu serta institusi merencanakan pendidikan, mempersiapkan beasiswa, dan meningkatkan keterampilan." />
		<meta name="twitter:image" content="https://sdjnusantara.com/og-image.png" />
		<meta name="twitter:image:alt" content="SDJ Nusantara — Strategic Your Partner" />

		<!-- WhatsApp and crawler image fallback -->
		<link rel="image_src" href="https://sdjnusantara.com/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
